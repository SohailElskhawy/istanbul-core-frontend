<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Product & User Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Header & Action Card -->
        <header class="header-card">
            <div class="title-section">
                <h1>TypeScript Dynamic Table</h1>
                <p>Generate random paired records from strongly typed Product and User models.</p>
            </div>
            <div class="actions-section">
                <span id="row-count" class="counter-badge">0 entries</span>
                <button id="add-row-btn" class="btn btn-primary">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    Add Random Row
                </button>
            </div>
        </header>

        <!-- Table Display Card -->
        <main class="table-card">
            <div class="table-responsive">
                <table id="data-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Product</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Assigned User</th>
                            <th>User Email</th>
                            <th>Role</th>
                        </tr>
                    </thead>
                    <tbody id="table-body">
                        <tr id="empty-state">
                            <td colspan="7" class="empty-state-cell">
                                <div class="empty-state-icon">📋</div>
                                <p>No records generated yet.</p>
                                <p style="font-size: 0.85rem; margin-top: 0.25rem;">Click the <strong>Add Random Row</strong> button above to populate data.</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Script loading the compiled TypeScript module -->
    <script type="module" src="dist/main.js"></script>
</body>
</html>
